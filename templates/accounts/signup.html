{% extends "base.html" %}
{% block title %}Sign Up — BestOneGifted{% endblock %}
{% block content %}
<section class="auth-page">
    <h1>Create Your Account</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label>{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<p style="color:#c0392b;font-size:13px;">{{ error }}</p>{% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn">Sign Up</button>
    </form>
    <p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</section>
{% endblock %}
